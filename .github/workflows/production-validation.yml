name: Production Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:security
      - run: npm run build

  supabase:
    name: Supabase validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Normalize migrations for PostgreSQL immutability rules
        run: node scripts/normalize-migrations.mjs
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase
        run: supabase start
      - name: Apply migrations from a clean database
        run: supabase db reset --local
      - name: Validate Edge Functions compile
        shell: bash
        run: |
          set -euo pipefail
          for f in supabase/functions/*/index.ts; do
            echo "Checking $f"
            npx --yes deno@2.1.4 check --no-lock --node-modules-dir=auto "$f"
          done
      - name: Stop local Supabase
        if: always()
        run: supabase stop

  security:
    name: Secret-pattern scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Gitleaks needs the complete commit history to resolve the commit range
      # supplied by GitHub Actions. A shallow checkout can make that SHA absent
      # and causes gitleaks to fail before it can scan anything.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
