name: AI Environment Runner
on:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: ai-runner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Apply targeted TypeScript compatibility fixes
        run: |
          node <<'NODE'
          const fs = require('fs')
          const patch = (file, pattern, replacement) => {
            if (!fs.existsSync(file)) throw new Error(`Missing ${file}`)
            const before = fs.readFileSync(file, 'utf8')
            const after = before.replace(pattern, replacement)
            if (after === before) console.log(`No change needed: ${file}`)
            else { fs.writeFileSync(file, after); console.log(`Patched: ${file}`) }
          }

          // Custom RPCs are present in the deployed Supabase schema but are not
          // represented in the checked-in generated Database type. Cast only the
          // function identifier so the rest of each call remains type-checked.
          const rpcNames = [
            ['src/components/marketplace/MultiMatchSelectionGrid.tsx', "supabase.rpc('match_global_sku',", "supabase.rpc('match_global_sku' as any,"],
            ['src/components/ui/MeetupPanel.tsx', "supabase.rpc('check_ghost_refund',", "supabase.rpc('check_ghost_refund' as any,"],
            ['src/components/ui/MeetupPanel.tsx', "supabase.rpc('check_priority_relist_v2',", "supabase.rpc('check_priority_relist_v2' as any,"],
            ['src/components/wallet/MicroEscrowLauncher.tsx', "supabase.rpc('create_wallet_micro_escrow',", "supabase.rpc('create_wallet_micro_escrow' as any,"],
            ['src/components/wallet/WalletDashboard.tsx', "supabase.rpc('transfer_plug_credit',", "supabase.rpc('transfer_plug_credit' as any,"],
            ['src/contexts/AuthContext.tsx', "supabase.rpc('provision_emergency_tokens',", "supabase.rpc('provision_emergency_tokens' as any,"],
            ['src/lib/security.js', "supabase.rpc('provision_emergency_tokens',", "supabase.rpc('provision_emergency_tokens' as any,"],
            ['src/lib/sessionHandoff.ts', "supabase.rpc('create_session_handoff',", "supabase.rpc('create_session_handoff' as any,"],
          ]
          for (const [file, from, to] of rpcNames) {
            if (!fs.existsSync(file)) continue
            const before = fs.readFileSync(file, 'utf8')
            const after = before.replaceAll(from, to)
            if (after !== before) fs.writeFileSync(file, after)
          }

          // Give custom Edge/RPC response payloads explicit local shapes rather
          // than weakening the Supabase client globally.
          patch('src/components/chat/MarketplaceChat.tsx',
            "      if (scanResultData?.flagged && (scanResultData.confidence ?? 1) >= 0.8) {",
            "      const scan = scanResultData as { flagged?: boolean; confidence?: number } | null\n      if (scan?.flagged && (scan.confidence ?? 1) >= 0.8) {")

          patch('src/components/ui/CheckIn.tsx',
            "    if (data?.other_arrived) setOtherArrived(true)",
            "    if ((data as { other_arrived?: boolean } | null)?.other_arrived) setOtherArrived(true)")

          patch('src/components/ui/JuryPortal.tsx',
            "    toast.success(data?.case_closed\n      ? `⚖️ Verdict reached: ${data.verdict}. Justice served.`\n      : `✓ Vote recorded. ${data?.votes_cast} vote(s) so far.`\n    )",
            "    const result = data as { case_closed?: boolean; verdict?: string | null; votes_cast?: number } | null\n    toast.success(result?.case_closed\n      ? `⚖️ Verdict reached: ${result.verdict}. Justice served.`\n      : `✓ Vote recorded. ${result?.votes_cast} vote(s) so far.`\n    )")

          patch('src/components/ui/Referral.tsx',
            "      toast.success(`Referral applied! Referred by ${data?.referrer_name}`)",
            "      const result = data as { referrer_name?: string | null } | null\n      toast.success(`Referral applied! Referred by ${result?.referrer_name ?? 'a Campus Plug user'}`)")

          patch('src/components/transactions/LiveMeetupTracker.tsx',
            "      setBeacon(b)",
            "      setBeacon(b as BeaconResponse)")
          patch('src/components/transactions/LiveMeetupTracker.tsx',
            "        setProximity(p)",
            "        setProximity(p as ProximityResponse)")

          patch('src/lib/sessionHandoff.ts',
            "  if (!data || !('token' in data) || !data.token) { throw new Error('Unable to create mobile handoff'); }",
            "  const handoff = data as { token?: string; expires_at?: string; handoff_id?: string; transaction_id?: string | null } | null\n  if (!handoff?.token) { throw new Error('Unable to create mobile handoff'); }")
          patch('src/lib/sessionHandoff.ts',
            "  return data as {token:string;expires_at:string;handoff_id:string;transaction_id:string|null}",
            "  return handoff as {token:string;expires_at:string;handoff_id:string;transaction_id:string|null}")

          // React effect destructors must be synchronous. Discard the async
          // remove-channel result explicitly while still performing cleanup.
          patch('src/pages/WarRoom.tsx',
            'return () => supabase.removeChannel(ch)',
            'return () => { void supabase.removeChannel(ch) }')
          patch('src/components/ui/DemandEngine.tsx',
            'return () => supabase.removeChannel(channel)',
            'return () => { void supabase.removeChannel(channel) }')
          patch('src/components/transactions/LiveMeetupTracker.tsx',
            'return () => { supabase.removeChannel(ch) }',
            'return () => { void supabase.removeChannel(ch) }')
          NODE

      - name: Typecheck
        run: npm run typecheck

      - name: Security Regression Suite
        run: node scripts/security-regression.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Commit targeted fixes
        run: |
          if git diff --quiet; then
            echo "No compatibility patches were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "fix: resolve remaining TypeScript compatibility blockers [cp67-tsfix]"
          git push origin main
