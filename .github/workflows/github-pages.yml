name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  VITE_BASE_PATH: /campus-plug67/
  VITE_SUPABASE_URL: https://etwsfdovcgofhqseejjo.supabase.co
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Verify deployment bundle
        run: |
          test -f dist/index.html
          test -f dist/404.html
      - name: Validate built asset references
        shell: bash
        run: |
          set -euo pipefail
          grep -q '<title>' dist/index.html
          test -f dist/404.html
          find dist/assets -type f | grep -q .
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish site
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Post-deploy smoke check
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --location --max-time 15 "$PAGE_URL" | grep -q 'Campus Plug'; then
              exit 0
            fi
            sleep 5
          done
          echo 'GitHub Pages post-deploy smoke check failed.'
          exit 1
