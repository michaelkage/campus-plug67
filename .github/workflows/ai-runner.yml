name: AI Environment Runner
on:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: ai-runner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Apply targeted TypeScript compatibility fixes
        run: |
          node <<'NODE'
          const fs = require('fs')
          const patch = (file, pattern, replacement) => {
            if (!fs.existsSync(file)) throw new Error(`Missing ${file}`)
            const before = fs.readFileSync(file, 'utf8')
            const after = before.replace(pattern, replacement)
            if (after === before) console.log(`No change needed: ${file}`)
            else { fs.writeFileSync(file, after); console.log(`Patched: ${file}`) }
          }

          // Custom RPCs are present in the deployed Supabase schema but are not
          // represented in the checked-in generated Database type. Cast the
          // overloaded rpc method locally so only these unmapped calls escape
          // the generated function-name/argument constraint.
          const rpcNames = [
            ['src/components/marketplace/MultiMatchSelectionGrid.tsx', "supabase.rpc('match_global_sku' as any,", "(supabase.rpc as any)('match_global_sku',"],
            ['src/components/ui/MeetupPanel.tsx', "supabase.rpc('check_ghost_refund' as any,", "(supabase.rpc as any)('check_ghost_refund',"],
            ['src/components/ui/MeetupPanel.tsx', "supabase.rpc('check_priority_relist_v2' as any,", "(supabase.rpc as any)('check_priority_relist_v2',"],
            ['src/components/wallet/MicroEscrowLauncher.tsx', "supabase.rpc('create_wallet_micro_escrow' as any,", "(supabase.rpc as any)('create_wallet_micro_escrow',"],
            ['src/components/wallet/WalletDashboard.tsx', "supabase.rpc('transfer_plug_credit' as any,", "(supabase.rpc as any)('transfer_plug_credit',"],
            ['src/contexts/AuthContext.tsx', "supabase.rpc('provision_emergency_tokens' as any,", "(supabase.rpc as any)('provision_emergency_tokens',"],
            ['src/lib/sessionHandoff.ts', "supabase.rpc('create_session_handoff' as any,", "(supabase.rpc as any)('create_session_handoff',"],
          ]
          for (const [file, from, to] of rpcNames) {
            if (!fs.existsSync(file)) continue
            const before = fs.readFileSync(file, 'utf8')
            const after = before.replaceAll(from, to)
            if (after !== before) fs.writeFileSync(file, after)
          }

          // Explicit local response shapes for custom Edge/RPC payloads.
          patch('src/components/chat/MarketplaceChat.tsx',
            "      if (scanResultData?.flagged && (scanResultData.confidence ?? 1) >= 0.8) {",
            "      const scan = scanResultData as { flagged?: boolean; confidence?: number } | null\n      if (scan?.flagged && (scan.confidence ?? 1) >= 0.8) {")

          patch('src/components/ui/CheckIn.tsx',
            "    if (data?.other_arrived) setOtherArrived(true)",
            "    if ((data as { other_arrived?: boolean } | null)?.other_arrived) setOtherArrived(true)")

          patch('src/components/ui/JuryPortal.tsx',
            "    toast.success(data?.case_closed\n      ? `⚖️ Verdict reached: ${data.verdict}. Justice served.`\n      : `✓ Vote recorded. ${data?.votes_cast} vote(s) so far.`\n    )",
            "    const result = data as { case_closed?: boolean; verdict?: string | null; votes_cast?: number } | null\n    toast.success(result?.case_closed\n      ? `⚖️ Verdict reached: ${result.verdict}. Justice served.`\n      : `✓ Vote recorded. ${result?.votes_cast} vote(s) so far.`\n    )")

          patch('src/components/ui/Referral.tsx',
            "      toast.success(`Referral applied! Referred by ${data?.referrer_name}`)",
            "      const result = data as { referrer_name?: string | null } | null\n      toast.success(`Referral applied! Referred by ${result?.referrer_name ?? 'a Campus Plug user'}`)")

          patch('src/components/transactions/LiveMeetupTracker.tsx',
            "      setBeacon(b)",
            "      setBeacon(b as BeaconResponse)")
          patch('src/components/transactions/LiveMeetupTracker.tsx',
            "        setProximity(p)",
            "        setProximity(p as ProximityResponse)")

          // The custom RPC result is intentionally narrowed locally; null is a
          // valid Supabase response and must be handled before property access.
          patch('src/components/ui/MeetupPanel.tsx',
            "    supabase.rpc('check_ghost_refund', { p_transaction_id: tx.id }).then(({ data }) => setGhostEligible(!!data?.eligible))",
            "    (supabase.rpc as any)('check_ghost_refund', { p_transaction_id: tx.id }).then(({ data }: { data: unknown }) => { const result = data as { eligible?: boolean } | null; setGhostEligible(result?.eligible === true) })")
          patch('src/components/ui/MeetupPanel.tsx',
            "    supabase.rpc('check_priority_relist_v2', { p_transaction_id: tx.id }).then(({ data }) => setRelistEligible(!!data?.eligible))",
            "    (supabase.rpc as any)('check_priority_relist_v2', { p_transaction_id: tx.id }).then(({ data }: { data: unknown }) => { const result = data as { eligible?: boolean } | null; setRelistEligible(result?.eligible === true) })")
          patch('src/components/ui/MeetupPanel.tsx',
            "    const { data } = supabase.rpc('check_priority_relist_v2', { p_transaction_id: tx.id })",
            "    const { data } = await (supabase.rpc as any)('check_priority_relist_v2', { p_transaction_id: tx.id })")
          patch('src/components/ui/MeetupPanel.tsx',
            "    if (!data?.eligible) { toast.error(data?.reason || 'Not eligible'); return }",
            "    const result = data as { eligible?: boolean; reason?: string | null } | null\n    if (!result?.eligible) { toast.error(result?.reason || 'Not eligible'); return }")

          // React effect destructors must be synchronous. Discard the async
          // remove-channel result explicitly while still performing cleanup.
          patch('src/pages/WarRoom.tsx',
            /return \(\) => \{? ?supabase\.removeChannel\(ch\) ?\}?/g,
            'return () => { void supabase.removeChannel(ch) }')
          patch('src/components/ui/DemandEngine.tsx',
            /return \(\) => \{? ?supabase\.removeChannel\(channel\) ?\}?/g,
            'return () => { void supabase.removeChannel(channel) }')
          patch('src/components/transactions/LiveMeetupTracker.tsx',
            /return \(\) => \{? ?supabase\.removeChannel\(ch\) ?\}?/g,
            'return () => { void supabase.removeChannel(ch) }')
          NODE

      - name: Typecheck
        run: npm run typecheck

      - name: Security Regression Suite
        run: node scripts/security-regression.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Commit targeted fixes
        run: |
          if git diff --quiet; then
            echo "No compatibility patches were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "fix: resolve remaining TypeScript compatibility blockers [cp67-tsfix]"
          git push origin main