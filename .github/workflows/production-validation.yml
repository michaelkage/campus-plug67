name: Production Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # package.json is the source of truth while the dependency graph is being refreshed.
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:security
      - run: npm run build

  supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize migrations for PostgreSQL immutability rules
        run: node scripts/normalize-migrations.mjs
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - name: Apply migrations from a clean database
        run: supabase db reset --local
      - name: Validate Edge Functions compile
        shell: bash
        run: |
          set -euo pipefail
          for f in supabase/functions/*/index.ts; do
            echo "Checking $f"
            npx --yes deno@2.1.4 check --no-lock "$f"
          done
      - run: supabase stop

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret-pattern scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
