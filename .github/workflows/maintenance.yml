name: Campus Plug Maintenance

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Verify CLI configuration
        run: supabase --version
      - name: Maintenance reminder
        run: |
          echo "Scheduled maintenance is configured for the Supabase project."
          echo "Production deployment must invoke cleanup_phase2_17_data and cleanup_stale_idempotency_keys with service-role credentials."
