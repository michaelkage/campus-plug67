# This workflow integrates njsscan with GitHub's Code Scanning feature.
# njsscan is a Python-based static security scanner for Node.js applications.

name: njsscan sarif

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "44 4 * * 4"

permissions:
  contents: read

jobs:
  njsscan:
    name: njsscan code scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout the code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install njsscan
        run: python -m pip install --upgrade njsscan

      - name: Run njsscan
        run: njsscan . --sarif --output results.sarif || true

      - name: Upload njsscan report
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
