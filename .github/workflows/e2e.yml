name: Browser E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Do not cancel an in-flight validation just because another commit lands.
# GitHub-hosted runners are disposable, and cancelled builds hide the actual
# state of the commit that triggered them.
concurrency:
  group: browser-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    name: Playwright smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://etwsfdovcgofhqseejjo.supabase.co
      # A placeholder is sufficient for the unauthenticated browser smoke tests.
      # Production deployments use the real public anon key from GitHub Secrets.
      VITE_SUPABASE_ANON_KEY: e2e-placeholder-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock --prefer-offline @playwright/test@1.55.0

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-1.55.0

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Build production bundle
        run: npm run build

      - name: Run browser smoke tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
