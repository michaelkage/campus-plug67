project_id = "etwsfdovcgofhqseejjo"

[db]
major_version = 17

[api]
port = 54321
schemas = ["public", "graphql_public", "extensions"]
extra_search_path = ["public", "graphql_public", "extensions"]
max_rows = 1000

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/*"]

[edge_runtime]
enabled = true

# These endpoints perform their own authentication/authorization checks.
# Passkey login and Paystack webhooks cannot rely on Supabase's generic JWT gate.
[functions.passkey-auth]
verify_jwt = false

[functions.paystack-webhook]
verify_jwt = false
