project_id = "etwsfdovcgofhqseejjo"

[db]
major_version = 17

[api]
port = 54321
schemas = ["public", "graphql_public", "extensions"]
extra_search_path = ["public", "graphql_public", "extensions"]
max_rows = 1000

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/*"]

[edge_runtime]
enabled = true

[functions.passkey-auth]
verify_jwt = false

[functions.paystack-webhook]
verify_jwt = false

# Service-to-service workers authenticate with Supabase secret/service-role API
# keys in the `apikey` header. These are not user JWTs, so the platform JWT
# verifier must be disabled; each function performs its own exact key check.
[functions.release-escrow]
verify_jwt = false

[functions.calculate-trending]
verify_jwt = false

[functions.process-dispute]
verify_jwt = false

[functions.maintenance-cleanup]
verify_jwt = false
