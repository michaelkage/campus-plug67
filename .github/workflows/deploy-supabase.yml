name: Deploy Supabase Production

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'scripts/normalize-migrations.mjs'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy database and Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$SUPABASE_ACCESS_TOKEN" ]] || missing+=(SUPABASE_ACCESS_TOKEN)
          [[ -n "$SUPABASE_DB_PASSWORD" ]] || missing+=(SUPABASE_DB_PASSWORD)
          [[ -n "$SUPABASE_URL" ]] || missing+=(SUPABASE_URL)
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing GitHub Actions secret(s): %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Resolve project reference
        id: project
        shell: bash
        run: |
          set -euo pipefail
          host="${SUPABASE_URL#https://}"
          host="${host%%.*}"
          [[ "$host" =~ ^[a-z0-9]{20}$ ]] || { echo "Could not derive a valid Supabase project ref from SUPABASE_URL"; exit 1; }
          echo "ref=$host" >> "$GITHUB_OUTPUT"

      - name: Normalize migrations
        run: node scripts/normalize-migrations.mjs

      - name: Deploy Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          for dir in supabase/functions/*; do
            [[ -d "$dir" ]] || continue
            fn="$(basename "$dir")"
            [[ "$fn" == "_shared" ]] && continue
            echo "→ Deploying ${fn}..."
            supabase functions deploy "$fn" --project-ref "${{ steps.project.outputs.ref }}"
          done

      - name: Link project for database deployment
        run: supabase link --project-ref "${{ steps.project.outputs.ref }}" --password "$SUPABASE_DB_PASSWORD"

      - name: Repair stale remote migration history
        shell: bash
        run: |
          set -euo pipefail
          # These versions are present in production migration history but are
          # not part of the canonical repository migrations. Repair only updates
          # supabase_migrations.schema_migrations; it does not execute or undo SQL.
          #
          # 011-015 are historical repository migrations that were removed.
          supabase migration repair 011 012 013 014 015 --status reverted --linked
          # 20260608213351 is a dashboard/manual migration that is not present
          # in the canonical repository. Keeping it marked applied blocks
          # `supabase db push --include-all` with "remote migration versions not
          # found in local migrations directory". The canonical schema is owned
          # by the checked-in migrations, so reconcile this orphaned history row.
          supabase migration repair 20260608213351 --status reverted --linked

      - name: Apply database migrations
        shell: bash
        run: |
          set -euo pipefail
          # Local migrations 031+ are intentionally earlier than the latest
          # remote migration. --include-all tells the CLI to apply those files
          # instead of refusing with "local migration files to be inserted".
          supabase db push --linked --include-all

      - name: Verify deployed function endpoints
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SUPABASE_ANON_KEY" ]] || { echo 'Missing GitHub Actions secret: SUPABASE_ANON_KEY'; exit 1; }
          functions=(release-escrow join-pool paystack-webhook passkey-auth process-growth-events process-dispute calculate-trending)
          for fn in "${functions[@]}"; do
            echo "→ Verifying ${fn}..."
            for attempt in 1 2 3; do
              if curl --fail --silent --show-error --max-time 10 \
                -H "apikey: ${SUPABASE_ANON_KEY}" \
                -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
                -H "x-health-check: true" \
                "${SUPABASE_URL}/functions/v1/${fn}/ping" >/dev/null; then
                break
              fi
              [[ "$attempt" -lt 3 ]] || { echo "Health check failed for ${fn}"; exit 1; }
              sleep 2
            done
          done

          echo "→ Verifying security-gate..."
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error --max-time 10 \
              -X POST \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              -H "Content-Type: application/json" \
              --data '{"action":"check"}' \
              "${SUPABASE_URL}/functions/v1/security-gate" >/dev/null; then
              break
            fi
            [[ "$attempt" -lt 3 ]] || { echo "Security-gate health check failed"; exit 1; }
            sleep 2
          done

          echo 'All deployed Edge Functions passed health checks.'
