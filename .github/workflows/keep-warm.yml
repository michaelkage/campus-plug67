################################################################################
# Campus Plug — Operations
################################################################################
name: Campus Plug Operations

on:
  schedule:
    # Edge-function warmup runs every 5 minutes.
    - cron: '*/5 * * * *'
    # Auto-release runs independently every 15 minutes.
    - cron: '0,15,30,45 * * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to run'
        required: false
        default: 'warm'
        type: choice
        options: [warm, auto-release, all]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  validate-secrets:
    name: Validate Supabase credentials
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check required secrets are configured
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$SUPABASE_URL" ]] || missing+=(SUPABASE_URL)
          [[ -n "$SUPABASE_ANON_KEY" ]] || missing+=(SUPABASE_ANON_KEY)
          [[ -n "$SUPABASE_SERVICE_ROLE_KEY" ]] || missing+=(SUPABASE_SERVICE_ROLE_KEY)
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing GitHub Actions secret(s): %s\n' "${missing[*]}"
            exit 1
          fi
          echo 'Required Supabase secrets are configured.'

  warm-functions:
    name: Warm Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: validate-secrets
    if: github.event_name == 'schedule' || github.event.inputs.action == 'warm' || github.event.inputs.action == 'all'
    steps:
      - name: Health-check Edge Functions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          functions=(release-escrow join-pool paystack-webhook passkey-auth process-growth-events process-dispute calculate-trending)
          for fn in "${functions[@]}"; do
            echo "→ Pinging ${fn}..."
            curl --fail --silent --show-error --max-time 8 \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              -H "x-health-check: true" \
              "${SUPABASE_URL}/functions/v1/${fn}/ping" >/dev/null
          done
          echo "✅ All health checks passed."

  calculate-trending:
    name: Calculate Trending Scores
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: validate-secrets
    if: github.event_name == 'schedule'
    steps:
      - name: Run weighted gravity + anti-collusion + rookie boost
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --max-time 30 -d '{}' \
            "${SUPABASE_URL}/functions/v1/calculate-trending"

      - name: Rotate stale jury cases
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --max-time 20 -d '{"action":"rotate_jurors"}' \
            "${SUPABASE_URL}/functions/v1/process-dispute"

  auto-release:
    name: Process Auto-Release
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: validate-secrets
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.action == 'auto-release' || github.event.inputs.action == 'all')
    steps:
      - name: Trigger auto-release
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --max-time 30 -d '{"action":"auto_release"}' \
            "${SUPABASE_URL}/functions/v1/release-escrow"

  scheduled-auto-release:
    name: Scheduled Auto-Release
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: validate-secrets
    if: github.event_name == 'schedule' && github.event.schedule == '0,15,30,45 * * * *'
    steps:
      - name: Auto-release timed-out escrow transactions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --max-time 30 -d '{"action":"auto_release"}' \
            "${SUPABASE_URL}/functions/v1/release-escrow"
